name: Format Code (PHP-CS-Fixer)

on: push

permissions:
  contents: read

defaults:
  run:
    working-directory: ./

jobs:
  code-formatting:
    runs-on: ubuntu-latest
    steps:
      - name: Runner Common Setup
        uses: mridang/action-runner-common@v1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, pdo_sqlite, pdo_mysql, pdo_pgsql, dom
          tools: composer:v2

      - name: Install Dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check PHP-CS-Fixer
        run: composer format -- --dry-run --diff
